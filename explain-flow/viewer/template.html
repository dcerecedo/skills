<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
__META__
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2230; --ink-2: #4a5468; --ink-3: #8590a6;
  --line: #d6dbe4; --line-2: #e8ebf0; --grid: #eceff4;
  --node: #ffffff; --node-ink: #1c2230; --pkg: #f0f2f6;
  --hl: #d9480f; --hl-soft: rgba(217, 72, 15, 0.12); --hl-ink: #9c3307;
  --ok: #2b8a3e; --warn: #b07d10; --link: #1f5fbf;
  --dim: 0.22;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --panel: #191d26; --ink: #e6e9f0; --ink-2: #a9b1c3; --ink-3: #6c7590;
    --line: #2f3646; --line-2: #252b38; --grid: #1d222c;
    --node: #20252f; --node-ink: #e6e9f0; --pkg: #1c2029;
    --hl: #ff8a3d; --hl-soft: rgba(255, 138, 61, 0.16); --hl-ink: #ffb380;
    --ok: #5cc27a; --warn: #e0b44a; --link: #7fb0ff;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #191d26; --ink: #e6e9f0; --ink-2: #a9b1c3; --ink-3: #6c7590;
  --line: #2f3646; --line-2: #252b38; --grid: #1d222c;
  --node: #20252f; --node-ink: #e6e9f0; --pkg: #1c2029;
  --hl: #ff8a3d; --hl-soft: rgba(255, 138, 61, 0.16); --hl-ink: #ffb380;
  --ok: #5cc27a; --warn: #e0b44a; --link: #7fb0ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); display: flex; flex-direction: column; }
header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 16px; align-items: flex-start; }
header .titles { flex: 1; min-width: 0; }
h1 { font-size: 18px; line-height: 1.3; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
.meta { color: var(--ink-2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--ink-3); font-weight: 500; margin-right: 4px; }
.meta code { font-family: var(--mono); font-size: 12px; }
.tools { display: flex; gap: 6px; }
button { font: inherit; font-size: 12.5px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
button:hover { color: var(--ink); border-color: var(--ink-3); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); min-height: 0; }
#diagram-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
#tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 12px 7px; color: var(--ink-2); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab .kind { color: var(--ink-3); font-size: 11.5px; font-weight: 400; }
.tab .count { min-width: 18px; padding: 0 5px; border-radius: 3px; background: var(--hl); color: #fff; font-size: 11px; line-height: 17px; text-align: center; font-weight: 600; }
.tab .count[hidden] { display: none; }
#canvas-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
#zoom button { background: var(--panel); }
#notice { position: absolute; left: 12px; top: 12px; right: 12px; display: none; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--hl); padding: 7px 10px; border-radius: 4px; font-size: 12.5px; color: var(--ink-2); }
#notice.on { display: block; }
#notice a { color: var(--link); cursor: pointer; text-decoration: underline; }
#legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); display: none; }
#legend.on { display: block; }
#legend div { display: flex; align-items: center; gap: 8px; }
#legend svg { flex: none; }
#prose { overflow-y: auto; padding: 14px 18px 40px; background: var(--panel); min-height: 0; }
#prose .question { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); }
#prose .question b { color: var(--ink); font-weight: 600; }
.block { position: relative; padding: 10px 12px 10px 14px; margin: 0 -12px 4px -14px; border-left: 3px solid transparent; border-radius: 0 4px 4px 0; cursor: pointer; }
.block:hover { background: var(--line-2); }
.block.active { border-left-color: var(--hl); background: var(--hl-soft); }
.block.related { border-left-color: var(--line); }
.block h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 650; }
.block p { margin: 0 0 6px; }
.block p:last-child { margin-bottom: 0; }
.block code { font-family: var(--mono); font-size: 12.5px; background: var(--line-2); padding: 0 3px; border-radius: 3px; }
a.ref { font-family: var(--mono); font-size: 12px; color: var(--link); text-decoration: none; border-bottom: 1px dotted var(--link); white-space: nowrap; }
a.ref:hover { border-bottom-style: solid; }
.glossary { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }
.glossary h4 { margin: 0 0 6px; font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: none; }
.glossary dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
.glossary dt { color: var(--ink); }
.glossary dd { margin: 0; font-family: var(--mono); font-size: 12px; }
.hint { color: var(--ink-3); font-size: 12px; margin-top: 16px; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 380px; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.45; padding: 7px 9px; border-radius: 4px; display: none; }
#tip.on { display: block; }
#tip .code { font-family: var(--mono); }
#tip .st-verified { color: #8fe3a5; }
#tip .st-unverified { color: #f5d27a; }
/* diagram */
svg text { font-family: var(--sans); fill: var(--node-ink); }
.el { transition: opacity 120ms ease; }
.node rect, .node circle, .node path.shape, .node polygon { fill: var(--node); stroke: var(--ink-3); stroke-width: 1.2; }
.node.pkg > rect { fill: var(--pkg); stroke: var(--line); stroke-dasharray: none; }
.node .stereo { font-size: 10.5px; fill: var(--ink-3); }
.node .label { font-size: 12.5px; font-weight: 600; }
.node .icon { fill: none; stroke: var(--ink-3); stroke-width: 1; }
.node.solid circle.dot, .node circle.dot { fill: var(--ink); stroke: none; }
.edge path.line, .msg path.line { fill: none; stroke: var(--ink-2); stroke-width: 1.3; }
.edge.async path.line, .edge.dependency path.line { stroke-dasharray: 6 4; }
.edge text, .msg text.label { font-size: 11.5px; fill: var(--ink-2); }
.edge .label-bg, .msg .label-bg { fill: var(--bg); opacity: 0.85; }
.msg.return path.line, .msg.create path.line { stroke-dasharray: 6 4; }
.unverified path.line { stroke-dasharray: 2 3 !important; }
.unverified text.label { fill: var(--ink-3); }
.vmark { font-size: 10px; font-weight: 700; }
.vmark.unv { fill: var(--warn); }
.msg text.num { font-size: 10px; fill: var(--ink-3); font-weight: 600; }
.part rect { fill: var(--node); stroke: var(--ink-3); stroke-width: 1.2; }
.part text { font-size: 12.5px; font-weight: 600; }
.part .stereo { font-size: 10.5px; fill: var(--ink-3); font-weight: 400; }
.lifeline { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.frag rect.box { fill: none; stroke: var(--ink-3); stroke-width: 1; }
.frag path.tag { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1; }
.frag text { font-size: 11px; fill: var(--ink-2); }
.frag text.op { font-weight: 700; fill: var(--ink); }
.frag line.sep { stroke: var(--ink-3); stroke-dasharray: 5 4; }
.collapsed rect { fill: var(--line-2); stroke: var(--line); stroke-dasharray: 3 3; }
.collapsed text { font-size: 11.5px; fill: var(--ink-2); }
.note path.shape { fill: var(--panel); stroke: var(--ink-3); }
.note text { font-size: 11.5px; fill: var(--ink-2); }
/* highlight states */
svg.has-sel .el:not(.hl):not(.ctx) { opacity: var(--dim); }
.el.hl rect:not(.label-bg):not(.hitbox), .el.hl circle:not(.dot), .el.hl path.shape, .el.hl polygon { stroke: var(--hl); stroke-width: 2.2; }
.el.hl.part rect { fill: var(--hl-soft); }
.el.hl.node:not(.pkg) > rect { fill: var(--hl-soft); }
.el.hl path.line { stroke: var(--hl); stroke-width: 2.2; }
.el.hl text.label, .el.hl text.num { fill: var(--hl-ink); }
.el.hl .arrow { fill: var(--hl); stroke: var(--hl); }
.el.refhit rect:not(.label-bg):not(.hitbox), .el.refhit path.line, .el.refhit path.shape { stroke: var(--link) !important; stroke-width: 2.4 !important; }
.hitbox { fill: transparent; stroke: none; }
.arrow { fill: var(--ink-2); stroke: var(--ink-2); stroke-width: 1.2; }
.arrow.open { fill: none; }
.el.hit { cursor: pointer; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 55vh) auto; }
  #diagram-pane { border-right: 0; border-bottom: 1px solid var(--line); }
  header { padding: 12px 16px 8px; flex-direction: column; }
  #prose { padding: 12px 16px 32px; }
}
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1 id="topic"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="tools">
    <button id="btn-legend" title="Legend (l)">Legend</button>
    <button id="btn-theme" title="Toggle theme (t)">Theme</button>
  </div>
</header>
<main>
  <section id="diagram-pane">
    <nav id="tabs" role="tablist"></nav>
    <div id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="notice"></div>
      <div id="legend"></div>
      <div id="zoom">
        <button id="z-out" title="Zoom out (-)">−</button>
        <button id="z-fit" title="Fit (0)">Fit</button>
        <button id="z-in" title="Zoom in (+)">+</button>
      </div>
    </div>
  </section>
  <aside id="prose"></aside>
</main>
<div id="tip"></div>
<script type="application/json" id="model">__MODEL_JSON__</script>
<script>/*__ELK__*/</script>
<script>
(function () {
'use strict';
const DATA = JSON.parse(document.getElementById('model').textContent);
const X = DATA.explanation;
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const svg = $('#canvas');

const state = { tab: X.diagrams[0].id, block: null, view: null, layouts: {} };

// ---------------------------------------------------------------- utils
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const measureCtx = document.createElement('canvas').getContext('2d');
function textW(s, size, weight) {
  measureCtx.font = (weight || 400) + ' ' + size + 'px ' + getComputedStyle(document.body).fontFamily;
  return measureCtx.measureText(String(s)).width;
}
function parseRef(r) {
  const m = /^(.*?):(\d+)(?:-(\d+))?$/.exec(String(r || '').trim());
  return m ? { path: m[1].replace(/^\.\//, ''), line: +m[2], end: m[3] ? +m[3] : +m[2] } : null;
}
function editorHref(ref) {
  const p = parseRef(ref);
  if (!p) return '#';
  const abs = p.path.startsWith('/') ? p.path : DATA.repoRoot.replace(/\/$/, '') + '/' + p.path;
  return DATA.editorUrl.split('{abs}').join(encodeURI(abs)).split('{path}').join(encodeURI(p.path)).split('{line}').join(String(p.line));
}
function refLabel(ref) {
  const p = parseRef(ref);
  if (!p) return ref;
  const base = p.path.split('/').pop();
  return base + ':' + p.line + (p.end !== p.line ? '-' + p.end : '');
}
function sameRef(a, b) {
  const p = parseRef(a), q = parseRef(b);
  return p && q && p.path === q.path && p.line <= q.end && q.line <= p.end;
}
function wrap(text, maxW, size) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (textW(t, size) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function walk(steps, fn, depth) {
  for (const s of steps || []) { fn(s, depth || 0); if (s.type === 'fragment') for (const b of s.branches || []) walk(b.steps, fn, (depth || 0) + 1); }
}
const isMsg = s => !['fragment', 'collapsed', 'note'].includes(s.type);

// ---------------------------------------------------------------- header & prose
$('#topic').textContent = X.topic;
document.title = X.topic;
const meta = [];
if (X.scope.issue) meta.push('<span><b>Issue</b>' + esc(X.scope.issue) + '</span>');
meta.push('<span><b>Entry</b><a class="ref" href="' + esc(editorHref(X.scope.entry)) + '" title="' + esc(X.scope.entry) + '">' + esc(refLabel(X.scope.entry)) + '</a></span>');
if (X.scope.base) meta.push('<span><b>Diff base</b><code>' + esc(X.scope.base) + '</code></span>');
if (X.scope.focus) meta.push('<span><b>Focus</b>' + esc(X.scope.focus) + '</span>');
meta.push('<span><b>Generated</b>' + esc(new Date(DATA.generatedAt).toLocaleString()) + '</span>');
$('#meta').innerHTML = meta.join('');

function renderInline(text) {
  let h = esc(text);
  h = h.replace(/\[\[ref:([^\]]+)\]\]/g, (_, r) => {
    const ref = r.trim();
    return '<a class="ref" data-ref="' + esc(ref) + '" href="' + esc(editorHref(ref)) + '" title="' + esc(ref) + '">' + esc(refLabel(ref)) + '</a>';
  });
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return h.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}
const prose = $('#prose');
let ph = '';
if (X.question) ph += '<p class="question"><b>Question.</b> ' + esc(X.question) + '</p>';
for (const b of X.blocks) {
  ph += '<article class="block" tabindex="0" data-block="' + esc(b.id) + '">' +
    (b.title ? '<h3>' + esc(b.title) + '</h3>' : '') + renderInline(b.text) + '</article>';
}
if (X.glossary && X.glossary.length) {
  ph += '<div class="glossary"><h4>Glossary</h4><dl>' +
    X.glossary.map(g => '<dt>' + esc(g.term) + '</dt><dd>' + esc(g.code) + '</dd>').join('') + '</dl></div>';
}
ph += '<p class="hint">Select a paragraph (or press j / k) to highlight it in the diagram. Click a diagram element to find the paragraphs that explain it. Esc clears.</p>';
prose.innerHTML = ph;

prose.addEventListener('click', e => {
  if (e.target.closest('a.ref')) return;
  const b = e.target.closest('.block');
  if (b) select(b.dataset.block === state.block ? null : b.dataset.block, true);
});
prose.addEventListener('keydown', e => {
  const b = e.target.closest('.block');
  if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(b.dataset.block, true); }
});
prose.addEventListener('mouseover', e => {
  const a = e.target.closest('a.ref[data-ref]');
  svg.querySelectorAll('.refhit').forEach(n => n.classList.remove('refhit'));
  if (!a) return;
  svg.querySelectorAll('[data-ref]').forEach(n => { if (sameRef(n.dataset.ref, a.dataset.ref)) n.classList.add('refhit'); });
});

// ---------------------------------------------------------------- tabs
const KIND = { component: 'components', sequence: 'sequence', state: 'states', activity: 'activity' };
const tabs = $('#tabs');
for (const d of X.diagrams) {
  const t = document.createElement('button');
  t.className = 'tab'; t.setAttribute('role', 'tab'); t.dataset.tab = d.id;
  t.title = KIND[d.kind] + ' diagram';
  t.innerHTML = '<span>' + esc(d.title) + '</span><span class="count" hidden></span>';
  t.addEventListener('click', () => showTab(d.id));
  tabs.appendChild(t);
}

// ---------------------------------------------------------------- tooltip
const tip = $('#tip');
function showTip(ev, item) {
  const parts = ['<div><b>' + esc(item.label || item.id) + '</b></div>'];
  if (item.code) parts.push('<div class="code">' + esc(item.code) + '</div>');
  if (item.ref) parts.push('<div class="code">' + esc(item.ref) + '</div>');
  if (item.verification) {
    const v = item.verification;
    parts.push('<div class="st-' + v.status + '">' + (v.status === 'verified' ? 'Verified' : 'Not verified') + ' by ' + esc(v.by) + (v.reason ? ': ' + esc(v.reason) : '') + '</div>');
  }
  const n = blocksFor(state.tab, item.id).length;
  parts.push('<div style="opacity:.7">' + (n ? n + (n > 1 ? ' paragraphs explain this' : ' paragraph explains this') : 'No paragraph highlights this') + (item.ref ? ' · double-click opens the code' : '') + '</div>');
  tip.innerHTML = parts.join('');
  tip.classList.add('on');
  moveTip(ev);
}
function moveTip(ev) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.classList.remove('on'); }

// ---------------------------------------------------------------- element registry
let items = {}; // id -> model item of the current diagram
function hit(g, item) {
  g.classList.add('el', 'hit');
  g.dataset.id = item.id;
  if (item.ref) g.dataset.ref = item.ref;
  items[item.id] = item;
  g.addEventListener('mouseenter', ev => showTip(ev, item));
  g.addEventListener('mousemove', moveTip);
  g.addEventListener('mouseleave', hideTip);
  g.addEventListener('click', ev => { ev.stopPropagation(); fromDiagram(item.id); });
  g.addEventListener('dblclick', ev => { ev.stopPropagation(); if (item.ref) location.href = editorHref(item.ref); });
}

// ---------------------------------------------------------------- sequence renderer
function drawSequence(d, root) {
  const P = d.participants;
  const GAP = 34, PAD = 18, TOP = 16, HEAD = 46, ROW = 38, SELF = 44;
  const pw = P.map(p => Math.max(96, textW(p.label, 12.5, 600) + 28, textW(stereo(p), 10.5) + 28));
  // widen gaps for long labels between neighbours
  const idx = {}; P.forEach((p, i) => idx[p.id] = i);
  const need = new Array(P.length).fill(GAP);
  walk(d.steps, s => {
    if (!isMsg(s) || s.from === s.to) return;
    const a = Math.min(idx[s.from], idx[s.to]), b = Math.max(idx[s.from], idx[s.to]);
    const w = textW(s.label, 11.5) + 40;
    const span = b - a;
    for (let i = a; i < b; i++) need[i] = Math.max(need[i], w / span - (pw[i] + pw[i + 1]) / 2);
  });
  const cx = []; let x = PAD;
  P.forEach((p, i) => { cx.push(x + pw[i] / 2); x += pw[i] + (i < P.length - 1 ? need[i] : 0); });
  const width = x + PAD + SELF + 60;
  let y = TOP + HEAD + 22;
  const lifeG = el('g', {}, root);
  const fragG = el('g', {}, root);
  const msgG = el('g', {}, root);
  const partG = el('g', {}, root);
  let num = 0;

  function span(steps) {
    let lo = Infinity, hi = -Infinity;
    walk(steps, s => {
      const ids = s.type === 'note' ? s.over : [s.from, s.to].filter(Boolean);
      for (const id of ids) if (id in idx) { lo = Math.min(lo, idx[id]); hi = Math.max(hi, idx[id]); }
    });
    return [lo, hi];
  }
  function arrowHead(g, x1, y1, x2, y2, open) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = 9, W = 4.5;
    const p1 = [x2 - L * Math.cos(a) + W * Math.sin(a), y2 - L * Math.sin(a) - W * Math.cos(a)];
    const p2 = [x2 - L * Math.cos(a) - W * Math.sin(a), y2 - L * Math.sin(a) + W * Math.cos(a)];
    if (open) el('path', { class: 'arrow open', d: 'M' + p1 + 'L' + x2 + ',' + y2 + 'L' + p2 }, g);
    else el('path', { class: 'arrow', d: 'M' + p1 + 'L' + x2 + ',' + y2 + 'L' + p2 + 'Z' }, g);
  }
  function labelText(g, x, y, text, anchor, cls) {

  const line = (dash, open) => '<svg width="44" height="12"><path d="M2,6H38" stroke="currentColor" stroke-width="1.3" ' + (dash ? 'stroke-dasharray="' + dash + '"' : '') + '/><path d="M33,2L41,6L33,10' + (open ? '' : 'Z') + '" fill="' + (open ? 'none' : 'currentColor') + '" stroke="currentColor"/></svg>';
  if (d.kind === 'sequence') {
    rows.push('<div>' + line('', false) + 'synchronous call</div>');
    rows.push('<div>' + line('', true) + 'asynchronous (task, signal, event)</div>');
    rows.push('<div>' + line('6 4', true) + 'return</div>');
  } else {
    rows.push('<div>' + line('', false) + 'call / flow</div>');
    rows.push('<div>' + line('6 4', true) + 'async or dependency</div>');
  }
  rows.push('<div>' + line('2 3', false) + 'not verified against the code <b style="color:var(--warn)">?</b></div>');
  rows.push('<div><svg width="44" height="12"><rect x="2" y="1" width="38" height="10" rx="2" fill="var(--hl-soft)" stroke="var(--hl)" stroke-width="2"/></svg>covered by the selected paragraph</div>');
  $('#legend').innerHTML = rows.join('');
}
$('#btn-legend').onclick = () => $('#legend').classList.toggle('on');
$('#btn-theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  const order = X.blocks.map(b => b.id);
  const i = order.indexOf(state.block);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); select(order[Math.min(order.length - 1, i + 1)], true); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); select(order[Math.max(0, i < 0 ? 0 : i - 1)], true); }
  else if (e.key === 'Escape') select(null, false);
  else if (/^[1-9]$/.test(e.key) && X.diagrams[+e.key - 1]) showTab(X.diagrams[+e.key - 1].id);
  else if (e.key === '+' || e.key === '=') zoomBy(0.8);
  else if (e.key === '-') zoomBy(1.25);
  else if (e.key === '0') fit(content, content.top);
  else if (e.key === 'l') $('#btn-legend').click();
  else if (e.key === 't') $('#btn-theme').click();
});

// start: the tab and block from the URL hash, if any (#tab=seq&block=b2)
const h = new URLSearchParams(location.hash.slice(1));
const startTab = X.diagrams.some(d => d.id === h.get('tab')) ? h.get('tab') : X.diagrams[0].id;
showTab(startTab).then(() => { if (h.get('block')) select(h.get('block'), true); window.__ready = true; });
})();
</script>
</body>

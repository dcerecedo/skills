<!doctype html><html><head><style>
body{font-family:Inter,sans-serif;color:#1a1a1a;background:#fff;margin:0}
.btn{background:#3366ff;color:#fff;padding:8px 16px;border-radius:6px;border:1px solid #2952cc;font-size:14px}
.btn2{background:#3467fe;color:#fff;padding:8px 15px;border-radius:4px;font-size:14px}
h1{font-size:32px;font-weight:700;margin:24px}
p.muted{color:#999;margin:12px 24px;font-size:13px}
#modal{display:none;box-shadow:0 4px 12px rgba(0,0,0,.2);padding:24px;border-radius:12px}
#modal.open{display:block}
</style></head><body>
<h1>Dashboard</h1><p class="muted">Low contrast text</p>
<button class="btn" id="open">Open</button><button class="btn2">Other</button>
<div id="modal"><p>Modal body</p></div>
<script>document.getElementById('open').onclick=()=>document.getElementById('modal').classList.add('open')</script>
</body></html>
